<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統參數管理－畫面版本比較</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif; background:#eef1f5; color:#333; font-size:14px; }

  /* ===== 頂部工具列（非後台畫面，比較器自身的控制） ===== */
  .stickhdr { position:sticky; top:0; z-index:200; }
  .topbar { background:#1f2937; color:#fff; padding:12px 20px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .topbar h1 { font-size:16px; font-weight:600; margin-right:14px; }
  .vbtn { background:#374151; color:#d1d5db; border:1px solid #4b5563; border-radius:6px; padding:7px 16px; cursor:pointer; font-size:14px; }
  .vbtn:hover { background:#4b5563; color:#fff; }
  .vbtn.on { background:#2563eb; border-color:#2563eb; color:#fff; }
  .chkcol { margin-left:auto; display:flex; flex-direction:column; gap:5px; }
  .scopechk { display:flex; align-items:center; gap:6px; font-size:13px; color:#d1d5db; cursor:pointer; user-select:none; }
  .seclbl { color:#111; font-weight:600; font-size:15px; margin:18px 14px 0; }
  .natrow { display:flex; align-items:center; gap:14px; margin:16px 14px 2px; }
  .natrow .seclbl, .natrow .natwrap { margin:0; }
  body:not(.showsec) .seclbl { display:none; }
  .scopechk input { cursor:pointer; }

  /* ===== 版本說明條 ===== */
  .verdesc { background:#fffbe6; border-bottom:1px solid #f0e6c0; color:#8a6d1a; padding:8px 20px; font-size:13px; }

  /* ===== 後台畫面容器 ===== */
  .screen { max-width:1500px; margin:16px auto 60px; background:#fff; border:1px solid #e5e7eb; border-radius:6px; overflow:visible; box-shadow:0 1px 3px rgba(0,0,0,.05); }

  /* tab 列 */
  .mtabs { display:flex; flex-wrap:wrap; border-bottom:1px solid #e5e7eb; background:#fff; }
  .mtab { padding:15px 20px; cursor:pointer; color:#666; border-right:1px solid #f0f0f0; white-space:nowrap; }
  .mtab.active { color:#409eff; font-weight:500; }
  .mtab:hover { color:#409eff; }
  .mtabs2 { border-top:1px solid #e5e7eb; margin-top:12px; }
  .mtab.nogeo { color:#c0c4cc; }
  .mtab.nogeo.active { color:#409eff; }

  /* 區塊 */
  .pane { padding:6px 14px 20px; }
  .blk { border:1px solid #ebeef5; border-radius:4px; margin-top:14px; background:#fff; }
  .blk-t { color:#409eff; padding:13px 18px 9px; font-size:14px; }
  .blk-t .bhint { color:#b0b6bf; font-size:13px; margin-left:2px; }

  /* 參數列 */
  .prow { display:flex; align-items:center; min-height:52px; padding:8px 18px; border-top:1px solid #f0f2f5; }
  .blk .prow:first-child { border-top:none; }
  .blk-t + .prow { border-top:none; }
  .prow-l { flex:1 1 auto; padding-right:16px; color:#333; line-height:1.5; }
  .prow-l .hint { color:#b0b6bf; font-size:13px; }
  .prow-c { flex:0 0 52%; display:flex; align-items:flex-start; gap:10px; }
  .prow-c.rgt { flex:0 0 auto; margin-left:auto; }
  .pinput { flex:1 1 auto; border:1px solid #dcdfe6; border-radius:4px; padding:9px 12px; font-size:14px; color:#333; background:#fff; min-width:0; }
  .pinput::placeholder { color:#c0c4cc; }
  .pinput.ro { background:#f5f7fa; color:#909399; }
  textarea.pinput { resize:vertical; min-height:58px; font-family:Menlo,Consolas,monospace; font-size:13px; line-height:1.5; }
  .savebtn { background:#5e9bf7; color:#fff; border:none; border-radius:4px; padding:9px 18px; font-size:14px; cursor:pointer; flex:0 0 auto; }
  .savebtn:hover { background:#4a8bf0; }
  .upbtn { background:#5e9bf7; color:#fff; border:none; border-radius:4px; padding:9px 14px; font-size:14px; cursor:pointer; flex:0 0 auto; }
  .delbtn { background:#f56c6c; color:#fff; border:none; border-radius:4px; padding:8px 16px; font-size:14px; cursor:pointer; }

  /* 開關 */
  .tgwrap { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; flex:0 0 auto; }
  .tg { width:40px; height:22px; border-radius:11px; background:#dcdfe6; position:relative; transition:background .15s; flex:0 0 auto; }
  .tg::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .tg.on { background:#5e9bf7; }
  .tg.on::after { left:20px; }
  .tglbl { color:#909399; font-size:14px; }
  .tg.on + .tglbl { color:#5e9bf7; }

  /* 三欄開關格 */
  .grid3 { display:flex; border-top:1px solid #f0f2f5; }
  .blk-t + .grid3 { border-top:none; }
  .g3cell { flex:1 1 33.33%; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-right:1px solid #f0f2f5; min-height:52px; }
  .g3cell:last-child { border-right:none; }
  .g3cell .gname { padding-right:10px; }

  /* radio / checkbox */
  .rdgrp { display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
  .rditem { display:inline-flex; align-items:center; gap:7px; cursor:pointer; color:#333; }
  .rdo { width:15px; height:15px; border-radius:50%; border:1px solid #dcdfe6; position:relative; flex:0 0 auto; background:#fff; }
  .rdo.on { border-color:#409eff; }
  .rdo.on::after { content:''; position:absolute; top:3px; left:3px; width:7px; height:7px; border-radius:50%; background:#409eff; }
  .rditem.sel { color:#409eff; }
  .ckb { width:15px; height:15px; border:1px solid #dcdfe6; border-radius:2px; position:relative; flex:0 0 auto; background:#fff; }
  .ckb.on { background:#409eff; border-color:#409eff; }
  .ckb.on::after { content:''; position:absolute; left:4px; top:1px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }

  /* 數字步進器 */
  .stepper { display:inline-flex; align-items:center; border:1px solid #dcdfe6; border-radius:4px; overflow:hidden; }
  .stepper .stbtn { width:34px; height:38px; background:#f5f7fa; border:none; color:#606266; font-size:16px; cursor:pointer; }
  .stepper .stval { width:110px; text-align:center; border:none; border-left:1px solid #dcdfe6; border-right:1px solid #dcdfe6; height:38px; font-size:14px; padding:0 6px; }

  /* 皮膚切換 pill */
  .pillgrp { display:inline-flex; border:1px solid #dcdfe6; border-radius:4px; overflow:hidden; }
  .pill { padding:8px 20px; cursor:pointer; color:#606266; background:#fff; font-size:14px; }
  .pill.on { background:#5e9bf7; color:#fff; }

  /* 假下拉 */
  .fsel { display:inline-flex; align-items:center; justify-content:space-between; border:1px solid #dcdfe6; border-radius:4px; padding:9px 12px; color:#333; min-width:150px; gap:10px; background:#fff; cursor:pointer; }
  .fsel .ph { color:#c0c4cc; }
  .fsel .arr { color:#c0c4cc; font-size:12px; }

  /* 語系 chips */
  .chipbox { display:inline-flex; align-items:center; gap:6px; border:1px solid #dcdfe6; border-radius:4px; padding:6px 10px; background:#fff; }
  .chip { background:#f0f2f5; border-radius:3px; padding:3px 8px; color:#606266; font-size:13px; display:inline-flex; align-items:center; gap:5px; }
  .chip .x { color:#b0b6bf; font-size:12px; }

  /* 表格 */
  .ptable { width:100%; border-collapse:collapse; margin:4px 0 2px; }
  .ptable th { color:#909399; font-weight:400; padding:12px 10px; border-bottom:1px solid #ebeef5; text-align:center; font-size:14px; }
  .ptable td { padding:10px; border-bottom:1px solid #f5f7fa; text-align:center; vertical-align:middle; }
  .ptable tr:last-child td { border-bottom:none; }
  .ptable .tin { width:90%; border:1px solid #dcdfe6; border-radius:4px; padding:8px 10px; font-size:14px; text-align:left; }
  .ptable .greentx { color:#67c23a; }
  .ptable .bluetx { color:#409eff; cursor:pointer; }
  .ptable .tagcell { display:inline-block; background:#fafafa; border:1px solid #e4e7ed; border-radius:3px; padding:6px 14px; color:#909399; }
  .addlink { color:#409eff; cursor:pointer; padding:10px 18px; display:inline-flex; align-items:center; gap:5px; font-size:14px; }
  .addbtn-outline { display:inline-flex; align-items:center; gap:6px; border:1px solid #cfe1fb; color:#5e9bf7; background:#f4f9ff; border-radius:4px; padding:8px 16px; cursor:pointer; margin:12px 18px; font-size:14px; }
  .blkfoot { display:flex; justify-content:flex-end; align-items:center; gap:14px; padding:12px 18px; border-top:1px solid #f0f2f5; }

  /* 紅字提示 */
  .rnote { color:#f56c6c; }

  /* 維度標記 chip（核對用，非後台元素） */
  .scopetag { display:none; margin-left:8px; font-size:11px; border-radius:3px; padding:1px 7px; vertical-align:2px; white-space:nowrap; }
  body.showscope .scopetag { display:inline-block; }
  .sc-P  { background:#eceff3; color:#6b7280; border:1px solid #d6dae1; }
  .sc-PH { background:#fff3e0; color:#c2660a; border:1px solid #f5d9ac; }
  .sc-N  { background:#e3f0ff; color:#1d6fd6; border:1px solid #bcd9fb; }
  .sc-NC { background:#e3f8e9; color:#1d8f43; border:1px solid #b7e6c6; }
  .sc-X  { background:#f4f4f5; color:#9ca3af; border:1px solid #e4e4e7; text-decoration:line-through; }
  .sc-L  { background:#f3e8ff; color:#7c3aed; border:1px solid #ddc7f7; }
  .sc-O  { background:#fdf6d8; color:#8a6d1a; border:1px solid #efe0a3; }

  /* ===== 版本 1：下方國家區 ===== */
  .botdivider { border-top:2px dashed #cbd5e1; margin:26px 14px 0; }
  .natwrap { position:relative; display:inline-block; margin:16px 14px 2px; }
  .natsel { display:inline-flex; align-items:center; gap:26px; border:1px solid #7bc796; background:#eefcf3; border-radius:4px; padding:9px 14px; min-width:190px; justify-content:space-between; cursor:pointer; color:#333; }
  .natsel .arr { color:#8aa598; font-size:12px; }
  .natopts { position:absolute; top:calc(100% + 4px); left:0; min-width:190px; background:#fff; border:1px solid #e4e7ed; border-radius:4px; box-shadow:0 2px 12px rgba(0,0,0,.1); z-index:99; }
  .natopt { padding:10px 14px; cursor:pointer; }
  .natopt:hover { background:#f5f7fa; }
  .natopt.on { color:#409eff; }

  /* ＋ 按鈕與組合彈窗 */
  .plusbtn { width:34px; height:36px; border:1px solid #7bc796; background:#eefcf3; color:#1d8f43; border-radius:4px; font-size:18px; cursor:pointer; flex:0 0 auto; line-height:1; }
  .plusbtn:hover { background:#ddf5e6; }
  .pmask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:300; }
  .pmask.show { display:flex; align-items:flex-start; justify-content:center; }
  .pmodal { background:#fff; border-radius:6px; margin-top:110px; min-width:720px; max-width:92vw; box-shadow:0 4px 24px rgba(0,0,0,.18); }
  .pmodal-hd { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #f0f2f5; font-size:15px; color:#333; }
  .pmodal-x { cursor:pointer; color:#909399; font-size:18px; padding:0 4px; }
  .pmodal-bd { padding:8px 20px 20px; }
  .pmodal .savebtn { padding:7px 14px; }
  .pmodal .cancelbtn { background:#fff; border:1px solid #dcdfe6; color:#606266; border-radius:4px; padding:7px 14px; cursor:pointer; }
  .pmodal .tin { text-align:left; }

  /* 佔位提示 */
  .placebox { margin:30px auto; max-width:820px; border:1px dashed #cbd5e1; border-radius:8px; background:#f8fafc; color:#64748b; padding:40px 30px; text-align:center; line-height:1.9; font-size:14px; }
  .placebox b { color:#334155; }
</style>
</head>
<body>

<div class="stickhdr">
<div class="topbar">
  <h1>系統參數管理－畫面版本比較</h1>
  <button class="vbtn on" data-v="0" onclick="pickVer(0)">現行畫面</button>
  <button class="vbtn" data-v="1" onclick="pickVer(1)">版本 1</button>
  <button class="vbtn" data-v="2" onclick="pickVer(2)">版本 2</button>
  <button class="vbtn" data-v="3" onclick="pickVer(3)">版本 3</button>
  <button class="vbtn" data-v="4" onclick="pickVer(4)">版本 4</button>
  <button class="vbtn" data-v="5" onclick="pickVer(5)">版本 5</button>
  <div class="chkcol"><label class="scopechk"><input type="checkbox" id="scopechk" onchange="scopeToggle(this.checked)">顯示維度標記（核對用）</label><label class="scopechk"><input type="checkbox" id="secchk" checked onchange="secToggle(this.checked)">顯示區域名稱（通用設定／國家設定）</label></div>
</div>
<div class="verdesc" id="verdesc">現行畫面：依真實後台截圖 1:1 刻製，為五個版本的共同基準。</div>
</div>

<div class="screen">
  <div id="predrop"></div>
  <div class="mtabs" id="mtabs"></div>
  <div id="content"></div>
</div>

<script>
/* ==========================================================================
   系統參數管理－畫面版本比較
   資料驅動：MT ＝ 各分頁的現行畫面資料（照真實後台截圖 1:1）
   每個項目掛 sc 維度標記（依 RD 系統參數決議表）：
     P＝平台  PH＝菲律賓  N＝國家  NC＝國家＋幣種
     X＝裁減／移除／排除  L＝語系  O＝其他（逐項處置）
   ========================================================================== */

var SCOPE_NAME = { P:'平台', PH:'菲律賓', N:'國家', NC:'國家＋幣種', X:'裁減/移除', L:'語系', O:'其他' };

var MTAB_LIST = ['注册登陆','充值提款','推广相关','游戏配置','系统相关配置','在线用户数配置','短信相关配置','直播聊天室配置','发送邮箱配置','风控配置','KYC配置'];

/* ---------- 分頁資料 ---------- */
var MT = {};

/* ===== 注册登陆 ===== */
MT[0] = [
 { t:'注册参数配置', hint:'（注册默认需要填写账号、密码）', grid:[
   ['qq号码',false,'X'],['邮箱',true,'N'],['手机号',true,'N'],
   ['微信',false,'X'],['注册验证码',true,'P'],['提款密码',false,'N'],
   ['真实姓名',false,'N'],['短信验证码',true,'N'],['邀请码',false,'N'],
   ['zalo',false,'X'],['facebook',false,'X'],['whatsapp',false,'X'],
   ['telegram',true,'X'],['地址',true,'X'],['国家与币种',false,'P'],
   ['KYC验证',true,'PH'],['生日',false,'X'],['薪资来源',true,'X'],
   ['安全问题回答',false,'N'],['投注站',true,'X'],['邮箱注册/邮箱OTP登陆',true,'O']
 ]},
 { t:'验证码参数配置', items:[
   {k:'sw', n:'会员系统登录验证码', on:false, sc:'P'},
   {k:'rd', n:'前台验证码类型', opts:['数字验证码','滑动图片验证码'], sel:1, sc:'P'},
   {k:'in', n:'腾讯滑动拼图验证码CaptchaAppId', v:'189989674', sc:'P'},
   {k:'sw', n:'管理后台登录入口验证码', on:false, sc:'P'},
   {k:'sw', n:'管理后台登录入口google验证码', on:true, sc:'P'},
   {k:'sw', n:'是否验证重复手机号码', on:false, sc:'P'},
   {k:'in', n:'长时间未登录天数OTP设置', v:'0', sc:'N'}
 ]},
 { t:'过期时间参数配置', items:[
   {k:'in', n:'会员在线过期时间', h:'（分钟）', v:'1440', sc:'P'},
   {k:'in', n:'会员在线过期时间(glife)', h:'（分钟）', v:'1440', sc:'PH'},
   {k:'sw', n:'会员注册的真实姓名检测', h:'（关闭检测表示支持同名，开启检测表示不支持同名）', on:true, sc:'X'},
   {k:'in', n:'管理员在线过期时间', h:'（分钟）', v:'1440', sc:'P'}
 ]},
 { t:'用户其它参数', items:[
   {k:'sw', n:'隐藏用户资料为**', on:true, sc:'P'},
   {k:'sw', n:'注册资料完善', on:true, sc:'O'},
   {k:'in', n:'试玩账号默认金额', h:'（预设币种:PHP）', v:'10000', sc:'X'},
   {k:'in', n:'注册黑名单', h:'（多个使用分号“;”分隔）', v:';', sc:'X'},
   {k:'in', n:'注册ip黑名单', h:'（多个使用分号“;”分隔）', v:';', sc:'P'},
   {k:'in', n:'用户注册成功的消息内容', v:'注册成功，欢迎你', sc:'X'},
   {k:'in', n:'一天一个ip能注册多少用户', h:'（留空为不限制）', v:'', sc:'P'},
   {k:'in', n:'一天一个ip能试玩多少次', h:'（留空为不限制）', v:'10000', sc:'X'},
   {k:'in', n:'游客试玩同IP一天试玩次数', h:'（留空为不限制）', v:'', sc:'X'},
   {k:'sw', n:'注册条款是否默认为已勾选', on:true, sc:'N'},
   {k:'sw', n:'是否默认勾选21岁验证', on:true, sc:'PH'},
   {k:'sw', n:'是否开启Google授权登录', on:true, sc:'PH'},
   {k:'sw', n:'是否开启Facebook授权登录', on:true, sc:'N'},
   {k:'sw', n:'是否开启Apple授权登录（仅限iOS使用）', on:true, sc:'N'}
 ]},
 { t:'登入时验证相关参数', items:[
   {k:'sw', n:'非完全验证的用户登入Glife时是否提示KYC', on:true, sc:'PH'},
   {k:'sw', n:'会员登入是否提示kyc', on:true, sc:'N'},
   {k:'sw', n:'会员登入是否验证手机号码', on:false, sc:'N'},
   {k:'ck', n:'会员IP是勾选的国家时显示单独登录页', opts:['中国大陆','菲律宾','越南','泰国','印尼'], checked:[1], sc:'O'},
   {k:'sw', n:'是否自动临时冻结超过3天未KYC的平台类型帐号', on:false, sc:'PH'},
   {k:'sw', n:'是否自动临时冻结超过3天未KYC的其他类型帐号', on:false, sc:'PH'},
   {k:'sw', n:'ndrp冻结开关', on:true, sc:'PH'},
   {k:'sw', n:'账号合并', on:false, sc:'PH'},
   {k:'in', n:'会员注册默认代理邀请码', v:'Pasay-0000', sc:'NC'}
 ]},
 { items:[
   {k:'sw', n:'用户注册成功发送站内信开关', on:true, sc:'P'},
   {k:'ti', n:'用户注册成功发送站内信内容', sub:[['标题','Register a new account',false],['内容','Welcome to OKBet.单纯的',true]], sc:'L'}
 ]},
 { items:[
   {k:'sw', n:'用户注册成功发送短信开关', on:true, sc:'P'},
   {k:'ta', n:'用户注册成功发送短信内容', v:'Welcome to OKBet. Kindly fill up your personal information on the profile page. Have a good day!', sc:'L'}
 ]},
 { items:[
   {k:'sw', n:'用户注册成功发送邮箱开关', on:true, sc:'P'},
   {k:'ti', n:'用户注册成功发送邮箱内容', sub:[['标题','OKBET',false],['内容','Welcome to OKBET!!',true]], sc:'L'}
 ]},
 { items:[
   {k:'sw', n:'代理前台注册入口', on:false, sc:'P'},
   {k:'sw', n:'代理注册图形验证码', on:true, sc:'P'},
   {k:'in', n:'一天一个IP能注册多少代理', h:'（留空为不限制）', v:'100', sc:'P'},
   {k:'in', n:'代理注册默认挂靠大代理', v:'1021032', sc:'P'},
   {k:'sw', n:'代理注册成功是否需要审核', on:false, sc:'P'},
   {k:'sw', n:'Glife页面提示跳转主站开关', on:true, sc:'PH'}
 ]},
 { t:'玩家自动冻结', freeze:true, sc:'N' }
];

/* ===== 充值提款 ===== */
MT[1] = [
 { t:'提款参数配置', hint:'（提款默认开启真实姓名、提款密码）', grid:[
   ['真实姓名',true,'X'],['提款密码',true,'X'],['qq号码',false,'X'],
   ['邮箱',false,'N'],['手机号',true,'N'],['微信',false,'X']
 ], gridAfter:'wdVerify', items:[

/* ---------- 區塊渲染 ---------- */
function blockHtml(b){
  if(b.freeze) return freezeHtml(b.sc);
  if(b.oldSort) return oldSortHtml(b.sc);
  if(b.newSort) return newSortHtml(b.sc);
  if(b.floatType) return floatTypeHtml(b.sc);
  if(b.floatLabel) return floatLabelHtml(b.sc);
  if(b.emailList) return emailListHtml();
  var inner = '';
  if(b.t) inner += '<div class="blk-t">'+esc(b.t)+(b.hint?'<span class="bhint">'+esc(b.hint)+'</span>':'')+'</div>';
  if(b.grid) inner += gridHtml(b.grid);
  if(b.gridAfter === 'wdVerify') inner += wdVerifyHtml();
  if(b.items) inner += b.items.map(rowHtml).join('');
  return '<div class="blk">'+inner+'</div>';
}

/* ---------- 版本 1：上下分區的過濾邏輯 ---------- */
function tabHasGeo(t){
  var blocks = MT[t]; if(!blocks) return false;
  var hit = false;
  blocks.forEach(function(b){
    if(b.freeze && (b.sc==='N'||b.sc==='NC'||b.sc==='PH')) hit = true;
    if(b.grid) b.grid.forEach(function(p){ if(p[2]==='N'||p[2]==='NC'||p[2]==='PH') hit = true; });
    if(b.items) b.items.forEach(function(it){ if(it.sc==='N'||it.sc==='NC'||it.sc==='PH') hit = true; });
  });
  return hit;
}
function keepTop(sc){ return !(sc==='N' || sc==='NC' || sc==='PH'); }
function keepBot(sc){ return sc==='N' || sc==='NC' || (ST.nation==='菲律賓' && sc==='PH'); }

/* 由現行資料切出「上方通用區」版本的區塊清單 */
function topBlocks(blocks){
  var out = [];
  blocks.forEach(function(b){
    if(b.freeze || b.oldSort || b.newSort || b.floatType || b.floatLabel || b.emailList){
      var sc = b.sc;
      if(b.emailList || keepTop(sc)) out.push(b);
      return;
    }
    var nb = { t:b.t, hint:b.hint, bare:b.bare };
    if(b.grid){ nb.grid = b.grid.filter(function(p){ return keepTop(p[2]); }); }
    if(b.gridAfter){ nb.gridAfter = b.gridAfter; } /* 实名验证列 sc=O，留上方 */
    if(b.items){ nb.items = b.items.filter(function(it){ return keepTop(it.sc); }); }
    var has = (nb.grid && nb.grid.length) || nb.gridAfter || (nb.items && nb.items.length);
    if(has) out.push(nb);
  });
  return out;
}

/* 由現行資料切出「下方國家區」版本的區塊清單（NC 項掛＋） */
function botBlocks(blocks){
  var out = [];
  blocks.forEach(function(b){
    if(b.freeze){ if(keepBot(b.sc)) out.push(b); return; }
    if(b.oldSort || b.newSort || b.floatType || b.floatLabel || b.emailList) return;
    var nb = { t:b.t, hint:b.hint, bare:b.bare };
    if(b.grid){ nb.grid = b.grid.filter(function(p){ return keepBot(p[2]); }); }
    if(b.items){
      nb.items = b.items.filter(function(it){ return keepBot(it.sc); }).map(function(it){
        var c = Object.assign({}, it);
        if(it.sc === 'NC') c.plus = true;
        return c;
      });
    }
    var has = (nb.grid && nb.grid.length) || (nb.items && nb.items.length);
    if(has) out.push(nb);
  });
  return out;
}

/* ＋ 按鈕（帶入彈窗設定） */
function plusBtn(it, swOnly){
  var fields;
  if(it.k === 'duosw'){ fields = it.parts.map(function(p){ return {l:p[0], v:p[1]}; }); }
  else if(it.k === 'wdchg'){ fields = [{l:'提款账户变动: ≤（小时）', v:'1'},{l:'提款金额≥', v:'1'}]; }
  else if(it.k === 'sw'){ fields = []; }
  else { fields = [{l:'', v:(it.v||'')}]; }
  var cfg = { name:(it.n || (it.parts ? it.parts[0][0] : '')), sw:(it.k==='sw' || it.psw ? 1 : 0), fields:fields };
  return '<button class="plusbtn" data-cfg="'+esc(JSON.stringify(cfg))+'" onclick="plusOpen(this)">＋</button>';
}

/* ＋ 組合彈窗（單國家模式：該國家法幣＋USDT） */
var PLUS = { cfg:null, rows:[] };

  var cfg = JSON.parse(el.getAttribute('data-cfg').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'));
  var combos = (ST.nation === '菲律賓') ? [['菲律宾','PHP'],['菲律宾','USDT']] : [['越南','VND'],['越南','USDT']];
  PLUS.cfg = cfg;
  PLUS.rows = combos.map(function(c){
    return { nation:c[0], cur:c[1], vals:cfg.fields.map(function(f){ return f.v; }), on:true, editing:false };
  });
  renderPlus();
};

window.plusSaveRow = function(i){ PLUS.rows[i].editing = false; renderPlus(); };
window.plusCancelRow = function(i){ PLUS.rows[i].editing = false; renderPlus(); };
window.plusTg = function(i){ PLUS.rows[i].on = !PLUS.rows[i].on; renderPlus(); };

    +'</div>';

    dd = '<div class="natopts">' + opts.map(function(o){
      return '<div class="natopt'+(o===ST.nation?' on':'')+'" onclick="natPick(\''+o+'\')">'+o+'</div>';

/* 版本 2：下方平鋪（無區塊標題，全部設定連續列出） */
function botFlatHtml(blocks){
  var bots = botBlocks(blocks);
  var html = '', cur = '';
  function flush(){ if(cur){ html += '<div class="blk">' + cur + '</div>'; cur = ''; } }
  bots.forEach(function(b){
    if(b.freeze){ flush(); html += freezeHtml(b.sc); return; }
    if(b.grid && b.grid.length) cur += gridHtml(b.grid);
    if(b.items && b.items.length) cur += b.items.map(rowHtml).join('');
  });
  flush();
  return html;
}

/* 版本 3：上方平鋪（表格型設定保留原表與名稱，屬單一設定本身） */
function topFlatHtml(blocks){
  var tops = topBlocks(blocks);
  var html = '', cur = '';
  function flush(){ if(cur){ html += '<div class="blk">' + cur + '</div>'; cur = ''; } }
  tops.forEach(function(b){
    if(b.oldSort || b.newSort || b.floatType || b.floatLabel || b.emailList || b.freeze){
      flush(); html += blockHtml(b); return;
    }
    if(b.grid && b.grid.length) cur += gridHtml(b.grid);
    if(b.gridAfter === 'wdVerify') cur += wdVerifyHtml();
    if(b.items && b.items.length) cur += b.items.map(rowHtml).join('');
  });
  flush();
  return html;
}

/* ---------- 分頁與版本渲染 ---------- */
function renderTabs(){
  var el = document.getElementById('mtabs');
  el.innerHTML = MTAB_LIST.map(function(t,i){
    var gray = ((ST.ver >= 1 && ST.ver <= 3) || (ST.ver === 5 && ST.scope5 !== '通用設置')) && !tabHasGeo(i) ? ' nogeo' : '';
    return '<div class="mtab'+(i===ST.tab?' active':'')+gray+'" onclick="pickTab('+i+')">'+t+'</div>';
  }).join('');
  var pre = document.getElementById('predrop');
  if(ST.ver === 5){
    var opts = ['通用設置','菲律賓','其他國家'];
    var dd = '';
    if(ST.pre5Open){
      dd = '<div class="natopts">' + opts.map(function(o){
        return '<div class="natopt'+(o===ST.scope5?' on':'')+'" onclick="pre5Pick(\''+o+'\')">'+o+'</div>';
      }).join('') + '</div>';
    }
    pre.innerHTML = '<div class="natrow" style="margin:14px 14px 12px;"><div class="natwrap"><div class="natsel" onclick="pre5Toggle()"><span>'+ST.scope5+'</span><span class="arr">▾</span></div>'+dd+'</div></div>';
  } else {
    pre.innerHTML = '';
  }
}
window.pre5Toggle = function(){ ST.pre5Open = !ST.pre5Open; renderTabs(); };
window.pre5Pick = function(o){ ST.scope5 = o; ST.pre5Open = false; ST.nation = (o==='其他國家') ? '其他國家' : '菲律賓'; renderTabs(); renderContent(); applyScope(); };
function renderContent(){
  var el = document.getElementById('content');
  var blocks = MT[ST.tab];
  if(!blocks){ el.innerHTML = '<div class="placebox">內容待補。</div>'; return; }
  if(ST.ver === 0){
    el.innerHTML = '<div class="pane">'+blocks.map(blockHtml).join('')+'</div>';
    return;
  }
  if(ST.ver === 1 || ST.ver === 2 || ST.ver === 3){
    var tops = topBlocks(blocks);
    var bots = botBlocks(blocks);
    var topHtml = (ST.ver === 3) ? topFlatHtml(blocks) : tops.map(blockHtml).join('');
    var html = '<div class="seclbl">通用設定</div><div class="pane">'+topHtml+'</div>';
    if(bots.length){
      var botHtml = (ST.ver === 2) ? botFlatHtml(blocks) : bots.map(blockHtml).join('');
      html += natDropHtml() + '<div class="pane" style="padding-top:0;">'+botHtml+'</div>';
    }
    el.innerHTML = html;
    return;
  }
  if(ST.ver === 5){
    var html5;
    if(ST.scope5 === '通用設置'){
      html5 = topBlocks(blocks).map(blockHtml).join('');
    } else {
      ST.nation = (ST.scope5 === '其他國家') ? '其他國家' : '菲律賓';
      var bots5 = botBlocks(blocks);
      html5 = bots5.length ? bots5.map(blockHtml).join('')
        : '<div class="placebox">本分頁無可依國家設置的參數。</div>';
    }
    el.innerHTML = '<div class="pane">'+html5+'</div>';
    return;
  }
  if(ST.ver === 4){
    var geoTabs = [];
    for(var i=0;i<MTAB_LIST.length;i++){ if(tabHasGeo(i)) geoTabs.push(i); }
    if(geoTabs.indexOf(ST.tab2) < 0) ST.tab2 = geoTabs[0];
    var topHtml4 = topBlocks(blocks).map(blockHtml).join('');
    var tabs2 = '<div class="mtabs mtabs2">' + geoTabs.map(function(i){
      return '<div class="mtab'+(i===ST.tab2?' active':'')+'" onclick="pickTab2('+i+')">'+MTAB_LIST[i]+'</div>';
    }).join('') + '</div>';
    var botHtml4 = botBlocks(MT[ST.tab2]).map(blockHtml).join('');
    el.innerHTML = '<div class="seclbl">通用設定</div><div class="pane">'+topHtml4+'</div>'
      + natDropHtml() + tabs2
      + '<div class="pane" style="padding-top:0;">'+botHtml4+'</div>';
    return;
  }
  el.innerHTML = '<div class="placebox"><b>版本 '+ST.ver+'</b><br>'+esc(VER_DESC[ST.ver])+'<br><br>本版本佈局製作中——版本 1 定稿後依序製作。</div>';
}

  document.querySelectorAll('.vbtn').forEach(function(b){ b.classList.toggle('on', Number(b.dataset.v)===v); });
  document.getElementById('verdesc').textContent = VER_DESC[v];
  renderTabs();
  renderContent();
  applyScope();
};
